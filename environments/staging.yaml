# Service Account Configuration
serviceAccount:
  enabled: true
  name: retail-kanopy-sa
  annotations: {}   # Placeholder for injecting GCP Service Account annotation via Helm/pipeline. Reserved for ServiceAccount annotations injected at deploy time

# Mount GCP credential config AND projected service account token
extraVolumes:
  - name: gcp-creds
    configMap:
      name: gcp-wif-config-retail
  - name: gcp-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
            audience: "//iam.googleapis.com/projects/531154772515/locations/global/workloadIdentityPools/kanopy-retail-wif-pool/providers/kanopy-retail-provider"

extraVolumeMounts:
  - name: gcp-creds
    mountPath: /etc/gcp
    readOnly: true
  - name: gcp-token
    mountPath: /var/run/service-account
    readOnly: true

# Secret references for sensitive data
envSecrets:
  MONGODB_URI: retail-store-staging
  DB_NAME: retail-store-staging
  COLLECTION_NAME: retail-store-staging
  GCP_STORAGE_BUCKET: retail-store-staging
  VERTEX_AI_ENDPOINT: retail-store-staging
  DYNAMIC_PRICING_AUDIENCE: retail-store-staging
  DYNAMIC_PRICING_START_URL: retail-store-staging
  DYNAMIC_PRICING_STOP_URL: retail-store-staging
  PORT: retail-store-staging
  GCP_BUCKET_FOLDER: retail-store-staging

# Environment variables for GCP
env:
  GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credential-configuration.json
  GCP_PROJECT_ID: ist-retail-demo
  GCP_LOCATION: us-central1
  # Stop GCP client libs (google-auth-library/gcp-metadata) from probing the
  # link-local metadata endpoint 169.254.169.254 — same IP as AWS IMDS, which
  # Kanopy's IMDS audit flags. All GCP auth uses the mounted WIF file creds, so
  # the metadata server is never legitimately needed.
  GOOGLE_CLOUD_PROJECT: ist-retail-demo
  METADATA_SERVER_DETECTION: none

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: angie.guemes@mongodb.com